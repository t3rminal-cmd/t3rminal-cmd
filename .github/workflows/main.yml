# Generates the contribution chart, stats cards and fun fact of the day,
# and publishes them to the "output" branch for the README to load.
name: Generate Profile Images

# Controls when the action will run.
on:
  schedule:
      # every 12 hours
    - cron: "0 */12 * * *"

  # This command allows us to run the Action automatically from the Actions tab.
  workflow_dispatch:
 
  # Also run on every push on the main branch
  push:
    branches:
    - main

# The job pushes to the "output" branch, so the token needs write access
# (new repos default GITHUB_TOKEN to read-only).
permissions:
  contents: write

# The sequence of runs in this workflow:
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Clone repo
        uses: actions/checkout@v4
   
      # The public github-readme-stats.vercel.app instance is rate-limited and
      # often returns errors, so build the stats cards here instead.
      # The built-in GITHUB_TOKEN can't read contribution counts (the cards show 0);
      # the optional CONTRIB_TOKEN secret fixes that.
      - name: Create output folder
        run: mkdir -p dist

      # Picks a different line from fun-facts.txt each day
      - name: Generate fun fact of the day
        run: python3 scripts/fun_fact.py dist

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=t3rminal-cmd&show_icons=true&locale=en
          path: dist/stats.svg
          token: ${{ secrets.CONTRIB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=t3rminal-cmd&layout=compact&locale=en
          path: dist/top-langs.svg
          token: ${{ secrets.CONTRIB_TOKEN || secrets.GITHUB_TOKEN }}

      # Dark versions, shown to people using GitHub's dark theme
      - name: Generate stats card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=t3rminal-cmd&show_icons=true&locale=en&theme=github_dark&hide_border=true
          path: dist/stats-dark.svg
          token: ${{ secrets.CONTRIB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate top languages card (dark)
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=t3rminal-cmd&layout=compact&locale=en&theme=github_dark&hide_border=true
          path: dist/top-langs-dark.svg
          token: ${{ secrets.CONTRIB_TOKEN || secrets.GITHUB_TOKEN }}

      # Contribution chart (replaced the snake, which broke whenever its data source changed).
      # Start from the last published chart so a failed fetch never leaves the README blank.
      - name: Restore the last contribution chart
        run: |
          if git fetch --depth=1 origin output; then
            for f in contrib-dark.svg contrib-light.svg; do
              git show FETCH_HEAD:$f > dist/$f 2>/dev/null || rm -f dist/$f
            done
          fi

      - name: Generate contribution chart
        run: python3 scripts/contrib_graph.py dist t3rminal-cmd
        env:
          # Optional personal access token (see README). Without it the public contributions page is used.
          CONTRIB_TOKEN: ${{ secrets.CONTRIB_TOKEN }}

      - name: Show build status
        run: git status

      - name: Push new files to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update contribution chart, stats cards and fun fact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
