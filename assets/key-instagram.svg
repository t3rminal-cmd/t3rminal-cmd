<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 228" width="200" height="228" role="img" aria-label="instagram">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d3540"/><stop offset="1" stop-color="#171c23"/>
    </linearGradient>
    <linearGradient id="skirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2028"/><stop offset="1" stop-color="#07090c"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset=".4" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pool">
      <stop offset="0" stop-color="#ff2e88" stop-opacity=".75"/><stop offset="1" stop-color="#ff2e88" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .cap { animation: press 3.6s ease-in-out 0.80s infinite; }
      @keyframes press {
        0%, 6% { transform: translateY(0); }
        11% { transform: translateY(10px); }
        20%, 100% { transform: translateY(0); }
      }
      .pool { opacity: .35; animation: pool 3.6s ease-in-out 0.80s infinite; }
      @keyframes pool { 0%, 6% { opacity: .35; } 11% { opacity: 1; } 30%, 100% { opacity: .35; } }
      .glyph { animation: flash 3.6s ease-in-out 0.80s infinite; }
      @keyframes flash { 0%, 6% { opacity: .85; } 11% { opacity: 1; } 30%, 100% { opacity: .85; } }
      .lbl { font: 700 19px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #ff2e88; }
      @media (prefers-reduced-motion: reduce) { .cap, .pool, .glyph { animation: none; } }
    </style>
  </defs>
  <ellipse class="pool" cx="100" cy="176" rx="96" ry="26" fill="url(#pool)"/>
  <!-- switch housing: stays put while the cap moves -->
  <rect x="22" y="58" width="156" height="122" rx="24" fill="#05070a"/>
  <rect x="22" y="58" width="156" height="122" rx="24" fill="none" stroke="#ff2e88" stroke-opacity=".55" stroke-width="2"/>
  <g class="cap">
    <rect x="22" y="22" width="156" height="148" rx="26" fill="url(#skirt)" stroke="#000" stroke-opacity=".6"/>
    <rect x="22" y="22" width="156" height="148" rx="26" fill="none" stroke="#ff2e88" stroke-opacity=".35" stroke-width="1.5"/>
    <rect x="38" y="30" width="124" height="112" rx="20" fill="url(#top)"/>
    <rect x="38" y="30" width="124" height="112" rx="20" fill="url(#rim)"/>
    <rect x="38.5" y="30.5" width="123" height="111" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
    <g class="glyph" filter="url(#neon)" fill="none" stroke="#ff2e88" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"
       transform="translate(100 86) scale(1.12) translate(-60 -60)"><rect x="36" y="36" width="48" height="48" rx="14"/><circle cx="60" cy="60" r="11"/><circle cx="74.5" cy="45.5" r="1.5"/></g>
  </g>
  <text class="lbl" x="100" y="216" text-anchor="middle">instagram</text>
</svg>
