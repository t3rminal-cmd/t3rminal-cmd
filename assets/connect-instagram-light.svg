<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="instagram">
  <style>
    .spin { transform-origin: 48px 48px; animation: spin 9s linear infinite; }
    @keyframes spin { from { transform: rotate(240deg); } to { transform: rotate(600deg); } }
    @media (prefers-reduced-motion: reduce) { .spin { animation: none; transform: rotate(240deg); } }
  </style>
  <circle cx="48" cy="48" r="44" fill="none" stroke="#d0d7de" stroke-width="1.5"/>
  <circle class="spin" cx="48" cy="48" r="44" fill="none" stroke="#ff2e88" stroke-width="2"
          stroke-linecap="round" stroke-dasharray="49.8 276.5"/>
  <g transform="translate(26 26) scale(1.8333)" fill="none" stroke="#1f2328" stroke-width="1.6"
     stroke-linecap="round" stroke-linejoin="round" color="#1f2328"><rect x="4" y="4" width="16" height="16" rx="4.5"/><circle cx="12" cy="12" r="3.6"/><circle cx="16.6" cy="7.4" r=".5" fill="currentColor"/></g>
</svg>
