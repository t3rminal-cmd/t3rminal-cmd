<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 306" width="500" height="306" role="img" aria-label="CaseVault: Offline case-file manager that lives on your own SSD. No cloud, no servers, no tracking.">
  <defs>
    <style>
      @font-face { font-family: 'Marker'; src: url(data:font/woff2;base64,) format('woff2'); }
      .bar { font: 500 13px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #59636e; }
      .title { font: 44px 'Marker', 'Comic Sans MS', cursive; fill: url(#paint);
               stroke: #1f2328; stroke-width: 5px; paint-order: stroke; stroke-linejoin: round; }
      .badge { font: 700 13px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1a7f37; }
      .about { font: 400 14px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
      .pt { font: 400 13.5px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #59636e; }
      .arrow { fill: #1a7f37; }
      .chip { font: 600 12px 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1f2328; }
      .pulse { animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .25 } }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
    </style>
    <linearGradient id="paint" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#1bc830"/>
      <stop offset=".5" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#ff2e88"/>
    </linearGradient>
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
    <feDisplacementMap in="SourceGraphic" scale="3.5"/>
  </filter>
  </defs>
  <rect x="1" y="1" width="498" height="304" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <path d="M1,13 A12,12 0 0 1 13,1 H487 A12,12 0 0 1 499,13 V44 H1 Z" fill="#f6f8fa"/>
  <line x1="1" y1="44" x2="499" y2="44" stroke="#d0d7de"/>
  <circle cx="24" cy="22" r="5.5" fill="#1bc830"/><circle cx="42" cy="22" r="5.5" fill="#00d4ff"/><circle cx="60" cy="22" r="5.5" fill="#ff2e88"/>
  <text class="bar" x="250.0" y="27" text-anchor="middle">~/projects/casevault</text>
  <text class="title" x="28" y="104" transform="rotate(-2 28 104)">CaseVault</text>
  <g transform="translate(398,70)">
    <rect width="74" height="26" rx="13" fill="none" stroke="#1a7f37" stroke-width="1.5"/>
    
    <text class="badge" x="12" y="18">v1.180</text>
  </g>
  <text class="about" x="28" y="144">Offline case-file manager that lives on your</text><text class="about" x="28" y="165">own SSD. No cloud, no servers, no tracking.</text>
  <text class="pt" x="28" y="196"><tspan class="arrow">▸</tspan> Report, arrest &amp; link-chart PDFs</text><text class="pt" x="28" y="217"><tspan class="arrow">▸</tspan> Encrypted, Bates-numbered discovery</text><text class="pt" x="28" y="238"><tspan class="arrow">▸</tspan> On-device AI consistency checker</text>
  <g transform="translate(28,260)"><rect width="92" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de"/><text class="chip" x="10" y="16">JavaScript</text></g><g transform="translate(128,260)"><rect width="42" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de"/><text class="chip" x="10" y="16">PWA</text></g><g transform="translate(178,260)"><rect width="128" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de"/><text class="chip" x="10" y="16">File System API</text></g><g transform="translate(314,260)"><rect width="63" height="24" rx="6" fill="#f6f8fa" stroke="#d0d7de"/><text class="chip" x="10" y="16">Ollama</text></g>
</svg>
